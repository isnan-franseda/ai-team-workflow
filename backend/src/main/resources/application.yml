server:
  port: 8080

spring:
  application:
    name: kp-ai-chatbot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kp_chatbot}
    username: ${DB_USERNAME:kp_chatbot}
    password: ${DB_PASSWORD:kp_chatbot_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

llm:
  chat:
    provider: ${LLM_CHAT_PROVIDER:openai}
    api-key: ${LLM_CHAT_API_KEY:}
    model: ${LLM_CHAT_MODEL:gpt-4o-mini}
    base-url: ${LLM_CHAT_BASE_URL:https://api.openai.com/v1}

  embedding:
    provider: ${LLM_EMBEDDING_PROVIDER:openai}
    api-key: ${LLM_EMBEDDING_API_KEY:}
    model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}
    base-url: ${LLM_EMBEDDING_BASE_URL:https://api.openai.com/v1}

  timeout:
    connect-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:10}
    read-seconds: ${LLM_READ_TIMEOUT_SECONDS:60}
    max-retries: ${LLM_MAX_RETRIES:3}

chatbot:
  rate-limit:
    requests-per-minute: 20
  context:
    max-history-messages: ${MAX_HISTORY_MESSAGES:5}
    doc-weight-percent: 60
    web-weight-percent: 30
    max-context-chars: ${MAX_CONTEXT_CHARS:4000}
    doc-max-chars: ${DOC_MAX_CHARS:3000}
    web-max-chars: ${WEB_MAX_CHARS:600}
  search:
    top-k: 5
    similarity-threshold: ${SIMILARITY_THRESHOLD:0.5}
    max-web-results: 3
  chunking:
    chunk-size: 800
    overlap: 100
  ingestion:
    batch-size: 10
  fallback-message: "Maaf, saya tidak dapat menjawab pertanyaan Anda saat ini. Silakan hubungi layanan pelanggan Kredit Pintar untuk bantuan lebih lanjut."
  admin-key: ${ADMIN_API_KEY:dev-admin-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics