server:
  port: 8080

spring:
  application:
    name: kp-ai-chatbot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kp_chatbot}
    username: ${DB_USERNAME:kp_chatbot}
    password: ${DB_PASSWORD:kp_chatbot_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

minimax:
  chat:
    base-url: ${MINIMAX_CHAT_BASE_URL:http://localhost:8317}
    key: ${MINIMAX_CHAT_API_KEY:}
    model: ${MINIMAX_CHAT_MODEL:minimax-m2.7}
    connect-timeout-seconds: ${MINIMAX_CHAT_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${MINIMAX_CHAT_READ_TIMEOUT_SECONDS:60}
    max-retries: ${MINIMAX_CHAT_MAX_RETRIES:3}

jina:
  base-url: ${JINA_BASE_URL:https://api.jina.ai}
  key: ${JINA_API_KEY:}
  model: ${JINA_EMBEDDING_MODEL:jina-embeddings-v3}
  connect-timeout-seconds: ${JINA_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${JINA_READ_TIMEOUT_SECONDS:60}
  max-retries: ${JINA_MAX_RETRIES:3}

chatbot:
  rate-limit:
    requests-per-minute: 20
  context:
    max-history-messages: ${MAX_HISTORY_MESSAGES:5}
    doc-weight-percent: 60
    web-weight-percent: 30
    max-context-chars: ${MAX_CONTEXT_CHARS:2000}
    doc-max-chars: ${DOC_MAX_CHARS:1200}
    web-max-chars: ${WEB_MAX_CHARS:600}
  search:
    top-k: 5
    similarity-threshold: ${SIMILARITY_THRESHOLD:0.3}
    max-web-results: 3
  chunking:
    chunk-size: 400
    overlap: 50
  ingestion:
    batch-size: 10
  fallback-message: "Maaf, saya tidak dapat menjawab pertanyaan Anda saat ini. Silakan hubungi layanan pelanggan Kredit Pintar untuk bantuan lebih lanjut."
  admin-key: ${ADMIN_API_KEY:dev-admin-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics